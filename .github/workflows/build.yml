name: build
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: app/backend/requirements*.txt }
      - run: pip install -r app/backend/requirements-dev.txt
      - run: pytest -q tests
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: npm, cache-dependency-path: app/frontend/package-lock.json }
      - run: npm ci --no-audit --no-fund && npm run build
        working-directory: app/frontend

  image:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: ver
        run: echo "v=$(cat VERSION)" >> "$GITHUB_OUTPUT"
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/netlab
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NETLAB_VERSION=${{ github.ref_type == 'tag' && github.ref_name || format('{0}+main.{1}', steps.ver.outputs.v, github.run_number) }}
            NETLAB_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
