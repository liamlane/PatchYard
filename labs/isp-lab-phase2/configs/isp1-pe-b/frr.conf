frr defaults traditional
hostname isp1-pe-b
!
interface lo
 ip address 81.10.254.12/32
exit
!
interface eth1
 description UPLINK ISP1-CORE1
 ip address 81.10.255.10/30
 ip ospf network point-to-point
exit
!
interface eth2
 description UPLINK ISP1-CORE2
 ip address 81.10.255.22/30
 ip ospf network point-to-point
exit
!
interface eth3
 description CUSTOMER C1B (AS65102) - VRF C1B
exit
!
ip prefix-list PL-DEFAULT seq 10 permit 0.0.0.0/0
ip prefix-list PL-C1B-IN seq 10 permit 81.10.100.8/29
!
route-map RM-C1B-IN permit 10
 match ip address prefix-list PL-C1B-IN
exit
!
route-map RM-C1B-OUT permit 10
 match ip address prefix-list PL-DEFAULT
exit
!
router ospf
 ospf router-id 81.10.254.12
 passive-interface lo
 network 81.10.254.12/32 area 0
 network 81.10.255.8/30 area 0
 network 81.10.255.20/30 area 0
exit
!
mpls ldp
 router-id 81.10.254.12
 !
 address-family ipv4
  discovery transport-address 81.10.254.12
  !
  interface eth1
  exit
  !
  interface eth2
  exit
 exit-address-family
exit
!
router bgp 65001
 bgp router-id 81.10.254.12
 no bgp default ipv4-unicast
 neighbor RR peer-group
 neighbor RR remote-as 65001
 neighbor RR update-source lo
 neighbor 81.10.254.1 peer-group RR
 neighbor 81.10.254.1 description RR ISP1-CORE1
 neighbor 81.10.254.2 peer-group RR
 neighbor 81.10.254.2 description RR ISP1-CORE2
 !
 address-family ipv4 vpn
  neighbor RR activate
 exit-address-family
exit
!
router bgp 65001 vrf C1B
 bgp router-id 81.10.254.12
 neighbor 81.10.2.2 remote-as 65102
 neighbor 81.10.2.2 description CUSTOMER C1B
 !
 address-family ipv4 unicast
  neighbor 81.10.2.2 activate
  neighbor 81.10.2.2 route-map RM-C1B-IN in
  neighbor 81.10.2.2 route-map RM-C1B-OUT out
  label vpn export auto
  rd vpn export 81.10.254.12:1002
  rt vpn import 65001:999
  rt vpn export 65001:1002
  export vpn
  import vpn
 exit-address-family
exit
!
