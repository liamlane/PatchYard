frr defaults traditional
hostname isp1-pe-a
!
interface lo
 ip address 81.10.254.11/32
exit
!
interface eth1
 description UPLINK ISP1-CORE1
 ip address 81.10.255.6/30
 ip ospf network point-to-point
exit
!
interface eth2
 description UPLINK ISP1-CORE2
 ip address 81.10.255.18/30
 ip ospf network point-to-point
exit
!
interface eth3
 description CUSTOMER C1A (AS65101) - VRF C1A
exit
!
ip prefix-list PL-DEFAULT seq 10 permit 0.0.0.0/0
ip prefix-list PL-C1A-IN seq 10 permit 81.10.100.0/29
!
route-map RM-C1A-IN permit 10
 match ip address prefix-list PL-C1A-IN
exit
!
route-map RM-C1A-OUT permit 10
 match ip address prefix-list PL-DEFAULT
exit
!
router ospf
 ospf router-id 81.10.254.11
 passive-interface lo
 network 81.10.254.11/32 area 0
 network 81.10.255.4/30 area 0
 network 81.10.255.16/30 area 0
exit
!
mpls ldp
 router-id 81.10.254.11
 !
 address-family ipv4
  discovery transport-address 81.10.254.11
  !
  interface eth1
  exit
  !
  interface eth2
  exit
 exit-address-family
exit
!
router bgp 65001
 bgp router-id 81.10.254.11
 no bgp default ipv4-unicast
 neighbor RR peer-group
 neighbor RR remote-as 65001
 neighbor RR update-source lo
 neighbor 81.10.254.1 peer-group RR
 neighbor 81.10.254.1 description RR ISP1-CORE1
 neighbor 81.10.254.2 peer-group RR
 neighbor 81.10.254.2 description RR ISP1-CORE2
 !
 address-family ipv4 vpn
  neighbor RR activate
 exit-address-family
exit
!
router bgp 65001 vrf C1A
 bgp router-id 81.10.254.11
 neighbor 81.10.1.2 remote-as 65101
 neighbor 81.10.1.2 description CUSTOMER C1A
 !
 address-family ipv4 unicast
  neighbor 81.10.1.2 activate
  neighbor 81.10.1.2 route-map RM-C1A-IN in
  neighbor 81.10.1.2 route-map RM-C1A-OUT out
  label vpn export auto
  rd vpn export 81.10.254.11:1001
  rt vpn import 65001:999
  rt vpn export 65001:1001
  export vpn
  import vpn
 exit-address-family
exit
!
