frr defaults traditional
hostname inet-r1
!
interface eth1
 description TRANSIT ISP1-CORE1 (AS65001)
 ip address 1.1.255.1/30
exit
!
interface eth2
 description TRANSIT ISP1-CORE2 (AS65001)
 ip address 1.1.255.5/30
exit
!
interface eth3
 description TRANSIT ISP2-CORE1 (AS65002)
 ip address 1.1.255.9/30
exit
!
interface eth4
 description TRANSIT ISP2-CORE2 (AS65002)
 ip address 1.1.255.13/30
exit
!
interface eth5
 description PUBLIC SERVICES 1.1.1.0/28
 ip address 1.1.1.14/28
exit
!
ip prefix-list PL-INET-OUT seq 10 permit 1.1.1.0/28
ip prefix-list PL-INET-OUT seq 20 permit 81.10.0.0/16
ip prefix-list PL-INET-OUT seq 30 permit 92.20.0.0/16
ip prefix-list PL-ISP1-IN seq 10 permit 81.10.0.0/16
ip prefix-list PL-ISP2-IN seq 10 permit 92.20.0.0/16
!
route-map RM-ISP1-IN permit 10
 match ip address prefix-list PL-ISP1-IN
exit
!
route-map RM-ISP2-IN permit 10
 match ip address prefix-list PL-ISP2-IN
exit
!
route-map RM-INET-OUT permit 10
 match ip address prefix-list PL-INET-OUT
exit
!
router bgp 65000
 bgp router-id 1.1.1.14
 neighbor 1.1.255.2 remote-as 65001
 neighbor 1.1.255.2 description ISP1-CORE1
 neighbor 1.1.255.6 remote-as 65001
 neighbor 1.1.255.6 description ISP1-CORE2
 neighbor 1.1.255.10 remote-as 65002
 neighbor 1.1.255.10 description ISP2-CORE1
 neighbor 1.1.255.14 remote-as 65002
 neighbor 1.1.255.14 description ISP2-CORE2
 !
 address-family ipv4 unicast
  network 1.1.1.0/28
  neighbor 1.1.255.2 activate
  neighbor 1.1.255.2 default-originate
  neighbor 1.1.255.2 route-map RM-ISP1-IN in
  neighbor 1.1.255.2 route-map RM-INET-OUT out
  neighbor 1.1.255.6 activate
  neighbor 1.1.255.6 default-originate
  neighbor 1.1.255.6 route-map RM-ISP1-IN in
  neighbor 1.1.255.6 route-map RM-INET-OUT out
  neighbor 1.1.255.10 activate
  neighbor 1.1.255.10 default-originate
  neighbor 1.1.255.10 route-map RM-ISP2-IN in
  neighbor 1.1.255.10 route-map RM-INET-OUT out
  neighbor 1.1.255.14 activate
  neighbor 1.1.255.14 default-originate
  neighbor 1.1.255.14 route-map RM-ISP2-IN in
  neighbor 1.1.255.14 route-map RM-INET-OUT out
 exit-address-family
exit
!
