frr defaults traditional
hostname isp1-pe-c
!
interface lo
 ip address 81.10.254.13/32
exit
!
interface eth1
 description UPLINK ISP1-CORE1
 ip address 81.10.255.14/30
 ip ospf network point-to-point
exit
!
interface eth2
 description UPLINK ISP1-CORE2
 ip address 81.10.255.26/30
 ip ospf network point-to-point
exit
!
interface eth3
 description CUSTOMER C1C (AS65103) - VRF C1C
exit
!
ip prefix-list PL-DEFAULT seq 10 permit 0.0.0.0/0
ip prefix-list PL-C1C-IN seq 10 permit 81.10.100.16/29
!
route-map RM-C1C-IN permit 10
 match ip address prefix-list PL-C1C-IN
exit
!
route-map RM-C1C-OUT permit 10
 match ip address prefix-list PL-DEFAULT
exit
!
router ospf
 ospf router-id 81.10.254.13
 passive-interface lo
 network 81.10.254.13/32 area 0
 network 81.10.255.12/30 area 0
 network 81.10.255.24/30 area 0
exit
!
mpls ldp
 router-id 81.10.254.13
 !
 address-family ipv4
  discovery transport-address 81.10.254.13
  !
  interface eth1
  exit
  !
  interface eth2
  exit
 exit-address-family
exit
!
router bgp 65001
 bgp router-id 81.10.254.13
 no bgp default ipv4-unicast
 neighbor RR peer-group
 neighbor RR remote-as 65001
 neighbor RR update-source lo
 neighbor 81.10.254.1 peer-group RR
 neighbor 81.10.254.1 description RR ISP1-CORE1
 neighbor 81.10.254.2 peer-group RR
 neighbor 81.10.254.2 description RR ISP1-CORE2
 !
 address-family ipv4 vpn
  neighbor RR activate
 exit-address-family
exit
!
router bgp 65001 vrf C1C
 bgp router-id 81.10.254.13
 neighbor 81.10.3.2 remote-as 65103
 neighbor 81.10.3.2 description CUSTOMER C1C
 !
 address-family ipv4 unicast
  neighbor 81.10.3.2 activate
  neighbor 81.10.3.2 route-map RM-C1C-IN in
  neighbor 81.10.3.2 route-map RM-C1C-OUT out
  label vpn export auto
  rd vpn export 81.10.254.13:1003
  rt vpn import 65001:999
  rt vpn export 65001:1003
  export vpn
  import vpn
 exit-address-family
exit
!
