frr defaults traditional
hostname isp2-pe-c
!
interface lo
 ip address 92.20.254.13/32
exit
!
interface eth1
 description UPLINK ISP2-CORE1
 ip address 92.20.255.14/30
 ip ospf network point-to-point
exit
!
interface eth2
 description UPLINK ISP2-CORE2
 ip address 92.20.255.26/30
 ip ospf network point-to-point
exit
!
interface eth3
 description CUSTOMER C2C (AS65203) - VRF C2C
exit
!
ip prefix-list PL-DEFAULT seq 10 permit 0.0.0.0/0
ip prefix-list PL-C2C-IN seq 10 permit 92.20.100.16/29
!
route-map RM-C2C-IN permit 10
 match ip address prefix-list PL-C2C-IN
exit
!
route-map RM-C2C-OUT permit 10
 match ip address prefix-list PL-DEFAULT
exit
!
router ospf
 ospf router-id 92.20.254.13
 passive-interface lo
 network 92.20.254.13/32 area 0
 network 92.20.255.12/30 area 0
 network 92.20.255.24/30 area 0
exit
!
mpls ldp
 router-id 92.20.254.13
 !
 address-family ipv4
  discovery transport-address 92.20.254.13
  !
  interface eth1
  exit
  !
  interface eth2
  exit
 exit-address-family
exit
!
router bgp 65002
 bgp router-id 92.20.254.13
 no bgp default ipv4-unicast
 neighbor RR peer-group
 neighbor RR remote-as 65002
 neighbor RR update-source lo
 neighbor 92.20.254.1 peer-group RR
 neighbor 92.20.254.1 description RR ISP2-CORE1
 neighbor 92.20.254.2 peer-group RR
 neighbor 92.20.254.2 description RR ISP2-CORE2
 !
 address-family ipv4 vpn
  neighbor RR activate
 exit-address-family
exit
!
router bgp 65002 vrf C2C
 bgp router-id 92.20.254.13
 neighbor 92.20.3.2 remote-as 65203
 neighbor 92.20.3.2 description CUSTOMER C2C
 !
 address-family ipv4 unicast
  neighbor 92.20.3.2 activate
  neighbor 92.20.3.2 route-map RM-C2C-IN in
  neighbor 92.20.3.2 route-map RM-C2C-OUT out
  label vpn export auto
  rd vpn export 92.20.254.13:1003
  rt vpn import 65002:999
  rt vpn export 65002:1003
  export vpn
  import vpn
 exit-address-family
exit
!
