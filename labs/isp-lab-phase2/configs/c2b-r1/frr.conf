frr defaults traditional
hostname c2b-r1
!
interface eth1
 description ISP-2 WAN
 ip address 92.20.2.2/30
exit
!
interface eth2
 description PUBLIC LAN 92.20.100.8/29
 ip address 92.20.100.9/29
exit
!
ip prefix-list PL-DEFAULT seq 10 permit 0.0.0.0/0
ip prefix-list PL-LAN seq 10 permit 92.20.100.8/29
!
route-map RM-ISP-IN permit 10
 match ip address prefix-list PL-DEFAULT
exit
!
route-map RM-ISP-OUT permit 10
 match ip address prefix-list PL-LAN
exit
!
router bgp 65202
 bgp router-id 92.20.100.9
 neighbor 92.20.2.1 remote-as 65002
 neighbor 92.20.2.1 description ISP-2 PE-B
 !
 address-family ipv4 unicast
  network 92.20.100.8/29
  neighbor 92.20.2.1 activate
  neighbor 92.20.2.1 route-map RM-ISP-IN in
  neighbor 92.20.2.1 route-map RM-ISP-OUT out
 exit-address-family
exit
!
