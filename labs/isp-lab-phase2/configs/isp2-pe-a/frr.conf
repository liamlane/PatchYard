frr defaults traditional
hostname isp2-pe-a
!
interface lo
 ip address 92.20.254.11/32
exit
!
interface eth1
 description UPLINK ISP2-CORE1
 ip address 92.20.255.6/30
 ip ospf network point-to-point
exit
!
interface eth2
 description UPLINK ISP2-CORE2
 ip address 92.20.255.18/30
 ip ospf network point-to-point
exit
!
interface eth3
 description CUSTOMER C2A (AS65201) - VRF C2A
exit
!
ip prefix-list PL-DEFAULT seq 10 permit 0.0.0.0/0
ip prefix-list PL-C2A-IN seq 10 permit 92.20.100.0/29
!
route-map RM-C2A-IN permit 10
 match ip address prefix-list PL-C2A-IN
exit
!
route-map RM-C2A-OUT permit 10
 match ip address prefix-list PL-DEFAULT
exit
!
router ospf
 ospf router-id 92.20.254.11
 passive-interface lo
 network 92.20.254.11/32 area 0
 network 92.20.255.4/30 area 0
 network 92.20.255.16/30 area 0
exit
!
mpls ldp
 router-id 92.20.254.11
 !
 address-family ipv4
  discovery transport-address 92.20.254.11
  !
  interface eth1
  exit
  !
  interface eth2
  exit
 exit-address-family
exit
!
router bgp 65002
 bgp router-id 92.20.254.11
 no bgp default ipv4-unicast
 neighbor RR peer-group
 neighbor RR remote-as 65002
 neighbor RR update-source lo
 neighbor 92.20.254.1 peer-group RR
 neighbor 92.20.254.1 description RR ISP2-CORE1
 neighbor 92.20.254.2 peer-group RR
 neighbor 92.20.254.2 description RR ISP2-CORE2
 !
 address-family ipv4 vpn
  neighbor RR activate
 exit-address-family
exit
!
router bgp 65002 vrf C2A
 bgp router-id 92.20.254.11
 neighbor 92.20.1.2 remote-as 65201
 neighbor 92.20.1.2 description CUSTOMER C2A
 !
 address-family ipv4 unicast
  neighbor 92.20.1.2 activate
  neighbor 92.20.1.2 route-map RM-C2A-IN in
  neighbor 92.20.1.2 route-map RM-C2A-OUT out
  label vpn export auto
  rd vpn export 92.20.254.11:1001
  rt vpn import 65002:999
  rt vpn export 65002:1001
  export vpn
  import vpn
 exit-address-family
exit
!
