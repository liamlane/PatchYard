# Shared by dns1 (1.1.1.1) and dns2 (1.1.1.2): one file, records always match
no-resolv
no-hosts
interface=eth1
bind-interfaces
log-queries
# authoritative: unknown names NXDOMAIN, missing types (AAAA) NODATA.
# Without it dnsmasq REFUSES AAAA and musl resolvers (Alpine hosts) fail the lookup.
local=/#/
host-record=dns1.inet.lab,1.1.1.1
host-record=dns2.inet.lab,1.1.1.2
host-record=www.inet.lab,1.1.1.3
host-record=c1a.isp1.lab,81.10.100.2
host-record=c1b.isp1.lab,81.10.100.10
host-record=c1c.isp1.lab,81.10.100.18
host-record=c2a.isp2.lab,92.20.100.2
host-record=c2b.isp2.lab,92.20.100.10
host-record=c2c.isp2.lab,92.20.100.18
