frr defaults traditional
hostname isp1-core1
!
interface lo
 ip address 81.10.254.1/32
exit
!
interface eth1
 description TRANSIT INET-R1 (AS65000) - VRF INTERNET
exit
!
interface eth2
 description CORE LINK ISP1-CORE2
 ip address 81.10.255.1/30
 ip ospf network point-to-point
exit
!
interface eth3
 description PE ISP1-PE-A
 ip address 81.10.255.5/30
 ip ospf network point-to-point
exit
!
interface eth4
 description PE ISP1-PE-B
 ip address 81.10.255.9/30
 ip ospf network point-to-point
exit
!
interface eth5
 description PE ISP1-PE-C
 ip address 81.10.255.13/30
 ip ospf network point-to-point
exit
!
vrf INTERNET
 ip route 81.10.0.0/16 blackhole
exit-vrf
!
ip prefix-list PL-OWN seq 10 permit 81.10.0.0/16 le 32
ip prefix-list PL-AGG seq 10 permit 81.10.0.0/16
!
route-map RM-INET-IN deny 10
 match ip address prefix-list PL-OWN
exit
route-map RM-INET-IN permit 20
exit
!
route-map RM-INET-OUT permit 10
 match ip address prefix-list PL-AGG
exit
!
router ospf
 ospf router-id 81.10.254.1
 passive-interface lo
 network 81.10.254.1/32 area 0
 network 81.10.255.0/30 area 0
 network 81.10.255.4/30 area 0
 network 81.10.255.8/30 area 0
 network 81.10.255.12/30 area 0
exit
!
mpls ldp
 router-id 81.10.254.1
 !
 address-family ipv4
  discovery transport-address 81.10.254.1
  !
  interface eth2
  exit
  !
  interface eth3
  exit
  !
  interface eth4
  exit
  !
  interface eth5
  exit
 exit-address-family
exit
!
router bgp 65001
 bgp router-id 81.10.254.1
 bgp cluster-id 81.10.254.254
 no bgp default ipv4-unicast
 neighbor PE peer-group
 neighbor PE remote-as 65001
 neighbor PE update-source lo
 neighbor 81.10.254.11 peer-group PE
 neighbor 81.10.254.12 peer-group PE
 neighbor 81.10.254.13 peer-group PE
 neighbor 81.10.254.2 remote-as 65001
 neighbor 81.10.254.2 description RR PEER ISP1-CORE2
 neighbor 81.10.254.2 update-source lo
 !
 address-family ipv4 vpn
  neighbor PE activate
  neighbor PE route-reflector-client
  neighbor 81.10.254.2 activate
 exit-address-family
exit
!
router bgp 65001 vrf INTERNET
 bgp router-id 81.10.254.1
 neighbor 1.1.255.1 remote-as 65000
 neighbor 1.1.255.1 description INET-R1
 !
 address-family ipv4 unicast
  network 81.10.0.0/16
  neighbor 1.1.255.1 activate
  neighbor 1.1.255.1 route-map RM-INET-IN in
  neighbor 1.1.255.1 route-map RM-INET-OUT out
  label vpn export auto
  rd vpn export 81.10.254.1:999
  rt vpn import 65001:1001 65001:1002 65001:1003
  rt vpn export 65001:999
  export vpn
  import vpn
 exit-address-family
exit
!
