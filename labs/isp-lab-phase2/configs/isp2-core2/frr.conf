frr defaults traditional
hostname isp2-core2
!
interface lo
 ip address 92.20.254.2/32
exit
!
interface eth1
 description TRANSIT INET-R1 (AS65000) - VRF INTERNET
exit
!
interface eth2
 description CORE LINK ISP2-CORE1
 ip address 92.20.255.2/30
 ip ospf network point-to-point
exit
!
interface eth3
 description PE ISP2-PE-A
 ip address 92.20.255.17/30
 ip ospf network point-to-point
exit
!
interface eth4
 description PE ISP2-PE-B
 ip address 92.20.255.21/30
 ip ospf network point-to-point
exit
!
interface eth5
 description PE ISP2-PE-C
 ip address 92.20.255.25/30
 ip ospf network point-to-point
exit
!
vrf INTERNET
 ip route 92.20.0.0/16 blackhole
exit-vrf
!
ip prefix-list PL-OWN seq 10 permit 92.20.0.0/16 le 32
ip prefix-list PL-AGG seq 10 permit 92.20.0.0/16
!
route-map RM-INET-IN deny 10
 match ip address prefix-list PL-OWN
exit
route-map RM-INET-IN permit 20
exit
!
route-map RM-INET-OUT permit 10
 match ip address prefix-list PL-AGG
exit
!
router ospf
 ospf router-id 92.20.254.2
 passive-interface lo
 network 92.20.254.2/32 area 0
 network 92.20.255.0/30 area 0
 network 92.20.255.16/30 area 0
 network 92.20.255.20/30 area 0
 network 92.20.255.24/30 area 0
exit
!
mpls ldp
 router-id 92.20.254.2
 !
 address-family ipv4
  discovery transport-address 92.20.254.2
  !
  interface eth2
  exit
  !
  interface eth3
  exit
  !
  interface eth4
  exit
  !
  interface eth5
  exit
 exit-address-family
exit
!
router bgp 65002
 bgp router-id 92.20.254.2
 bgp cluster-id 92.20.254.254
 no bgp default ipv4-unicast
 neighbor PE peer-group
 neighbor PE remote-as 65002
 neighbor PE update-source lo
 neighbor 92.20.254.11 peer-group PE
 neighbor 92.20.254.12 peer-group PE
 neighbor 92.20.254.13 peer-group PE
 neighbor 92.20.254.1 remote-as 65002
 neighbor 92.20.254.1 description RR PEER ISP2-CORE1
 neighbor 92.20.254.1 update-source lo
 !
 address-family ipv4 vpn
  neighbor PE activate
  neighbor PE route-reflector-client
  neighbor 92.20.254.1 activate
 exit-address-family
exit
!
router bgp 65002 vrf INTERNET
 bgp router-id 92.20.254.2
 neighbor 1.1.255.13 remote-as 65000
 neighbor 1.1.255.13 description INET-R1
 !
 address-family ipv4 unicast
  network 92.20.0.0/16
  neighbor 1.1.255.13 activate
  neighbor 1.1.255.13 route-map RM-INET-IN in
  neighbor 1.1.255.13 route-map RM-INET-OUT out
  label vpn export auto
  rd vpn export 92.20.254.2:999
  rt vpn import 65002:1001 65002:1002 65002:1003
  rt vpn export 65002:999
  export vpn
  import vpn
 exit-address-family
exit
!
