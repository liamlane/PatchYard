frr defaults traditional
hostname c1a-r1
!
interface eth1
 description ISP-1 WAN
 ip address 81.10.1.2/30
exit
!
interface eth2
 description PUBLIC LAN 81.10.100.0/29
 ip address 81.10.100.1/29
exit
!
ip prefix-list PL-DEFAULT seq 10 permit 0.0.0.0/0
ip prefix-list PL-LAN seq 10 permit 81.10.100.0/29
!
route-map RM-ISP-IN permit 10
 match ip address prefix-list PL-DEFAULT
exit
!
route-map RM-ISP-OUT permit 10
 match ip address prefix-list PL-LAN
exit
!
router bgp 65101
 bgp router-id 81.10.100.1
 neighbor 81.10.1.1 remote-as 65001
 neighbor 81.10.1.1 description ISP-1 PE-A
 !
 address-family ipv4 unicast
  network 81.10.100.0/29
  neighbor 81.10.1.1 activate
  neighbor 81.10.1.1 route-map RM-ISP-IN in
  neighbor 81.10.1.1 route-map RM-ISP-OUT out
 exit-address-family
exit
!
