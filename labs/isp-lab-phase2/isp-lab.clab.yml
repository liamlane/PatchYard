      - configs/common/webhost.sh:/usr/local/bin/netlab-web:ro
      exec:
      - ip addr add 81.10.100.2/29 dev eth1
      - ip route replace default via 81.10.100.1 dev eth1
      - sh -c "echo nameserver 1.1.1.1 > /etc/resolv.conf"
      - sh /usr/local/bin/netlab-web
