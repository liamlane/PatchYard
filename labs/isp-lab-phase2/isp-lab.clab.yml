# Phase 2: dual ISP, RR pair per ISP, MPLS L3VPN, INTERNET VRF hub-and-spoke
name: isp-lab
mgmt:
  network: clab-mgmt
  ipv4-subnet: 172.31.255.0/24
topology:
  nodes:
    inet-r1:
      kind: linux
      image: quay.io/frrouting/frr:10.0.0
      binds:
      - configs/inet-r1/frr.conf:/etc/frr/frr.conf
      - configs/common/daemons:/etc/frr/daemons
      - configs/common/vtysh.conf:/etc/frr/vtysh.conf
      exec:
      - ip route del default
      - sysctl -w net.ipv4.ip_forward=1
    br-inet:
      kind: bridge
    dns1:
      kind: linux
      image: alpine:3.20
      cmd: tail -f /dev/null
      binds:
      - configs/dns/dnsmasq.conf:/etc/dnsmasq.conf
      exec:
      - apk add --no-cache dnsmasq iproute2
      - ip addr add 1.1.1.1/28 dev eth1
      - ip route replace default via 1.1.1.14 dev eth1
      - dnsmasq
    dns2:
      kind: linux
      image: alpine:3.20
      cmd: tail -f /dev/null
      binds:
      - configs/dns/dnsmasq.conf:/etc/dnsmasq.conf
      exec:
      - apk add --no-cache dnsmasq iproute2
      - ip addr add 1.1.1.2/28 dev eth1
      - ip route replace default via 1.1.1.14 dev eth1
      - dnsmasq
    web1:
      kind: linux
      image: ghcr.io/hellt/network-multitool
      binds:
      - configs/common/webhost.sh:/usr/local/bin/netlab-web:ro
      exec:
      - ip addr add 1.1.1.3/28 dev eth1
      - ip route replace default via 1.1.1.14 dev eth1
      - sh /usr/local/bin/netlab-web
    isp1-core1:
      kind: linux
      image: quay.io/frrouting/frr:10.0.0
      binds:
      - configs/isp1-core1/frr.conf:/etc/frr/frr.conf
      - configs/common/daemons:/etc/frr/daemons
      - configs/common/vtysh.conf:/etc/frr/vtysh.conf
      exec:
      - ip route del default
      - sysctl -w net.ipv4.ip_forward=1
      - sysctl -w net.mpls.platform_labels=1048575
      - sysctl -w net.mpls.conf.eth2.input=1
      - sysctl -w net.mpls.conf.eth3.input=1
      - sysctl -w net.mpls.conf.eth4.input=1
      - sysctl -w net.mpls.conf.eth5.input=1
      - sysctl -w net.ipv4.tcp_l3mdev_accept=1
      - sysctl -w net.ipv4.udp_l3mdev_accept=1
      - ip link add INTERNET type vrf table 999
      - ip link set INTERNET up
      - ip link set eth1 master INTERNET
      - ip addr add 1.1.255.2/30 dev eth1
    isp1-core2:
      kind: linux
      image: quay.io/frrouting/frr:10.0.0
      binds:
      - configs/isp1-core2/frr.conf:/etc/frr/frr.conf
      - configs/common/daemons:/etc/frr/daemons
      - configs/common/vtysh.conf:/etc/frr/vtysh.conf
