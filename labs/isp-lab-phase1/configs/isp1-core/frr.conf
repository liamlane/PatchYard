frr defaults traditional
hostname isp1-core
!
interface lo
 ip address 81.10.254.1/32
exit
!
interface eth1
 description TRANSIT INET-R1 (AS65000)
 ip address 1.1.255.2/30
exit
!
interface eth2
 description PE ISP1-PE-A
 ip address 81.10.255.1/30
 ip ospf network point-to-point
exit
!
! anchor for the /16 aggregate advertised to INET
ip route 81.10.0.0/16 blackhole
!
ip prefix-list PL-ISP1-AGG seq 10 permit 81.10.0.0/16
ip prefix-list PL-INET-IN seq 10 permit 1.1.1.0/28
!
route-map RM-INET-IN permit 10
 match ip address prefix-list PL-INET-IN
exit
!
route-map RM-INET-OUT permit 10
 match ip address prefix-list PL-ISP1-AGG
exit
!
router ospf
 ospf router-id 81.10.254.1
 passive-interface lo
 network 81.10.254.1/32 area 0
 network 81.10.255.0/30 area 0
exit
!
router bgp 65001
 bgp router-id 81.10.254.1
 neighbor 1.1.255.1 remote-as 65000
 neighbor 1.1.255.1 description INET-R1
 neighbor 81.10.254.11 remote-as 65001
 neighbor 81.10.254.11 description iBGP ISP1-PE-A
 neighbor 81.10.254.11 update-source lo
 !
 address-family ipv4 unicast
  network 81.10.0.0/16
  neighbor 1.1.255.1 activate
  neighbor 1.1.255.1 route-map RM-INET-IN in
  neighbor 1.1.255.1 route-map RM-INET-OUT out
  neighbor 81.10.254.11 activate
  neighbor 81.10.254.11 next-hop-self
 exit-address-family
exit
!
