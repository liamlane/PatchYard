frr defaults traditional
hostname isp1-pe-a
!
interface lo
 ip address 81.10.254.11/32
exit
!
interface eth1
 description UPLINK ISP1-CORE
 ip address 81.10.255.2/30
 ip ospf network point-to-point
exit
!
interface eth2
 description CUSTOMER C1A (AS65101)
 ip address 81.10.1.1/30
exit
!
ip prefix-list PL-DEFAULT seq 10 permit 0.0.0.0/0
ip prefix-list PL-C1A-IN seq 10 permit 81.10.100.0/29
!
route-map RM-C1A-IN permit 10
 match ip address prefix-list PL-C1A-IN
exit
!
route-map RM-C1A-OUT permit 10
 match ip address prefix-list PL-DEFAULT
exit
!
router ospf
 ospf router-id 81.10.254.11
 passive-interface lo
 network 81.10.254.11/32 area 0
 network 81.10.255.0/30 area 0
exit
!
router bgp 65001
 bgp router-id 81.10.254.11
 neighbor 81.10.254.1 remote-as 65001
 neighbor 81.10.254.1 description iBGP ISP1-CORE
 neighbor 81.10.254.1 update-source lo
 neighbor 81.10.1.2 remote-as 65101
 neighbor 81.10.1.2 description CUSTOMER C1A
 !
 address-family ipv4 unicast
  neighbor 81.10.254.1 activate
  neighbor 81.10.254.1 next-hop-self
  neighbor 81.10.1.2 activate
  neighbor 81.10.1.2 default-originate
  neighbor 81.10.1.2 route-map RM-C1A-IN in
  neighbor 81.10.1.2 route-map RM-C1A-OUT out
 exit-address-family
exit
!
