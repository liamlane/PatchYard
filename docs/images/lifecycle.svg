<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1114 430" width="1114" height="430" role="img" aria-label="netlab lab lifecycle"><title>netlab lab lifecycle</title>
<style>
  .bg{fill:#ffffff} .grp{fill:#f5f7fa;stroke:#c9d2dc} .grp2{fill:#eef3f9;stroke:#9fb3c8}
  .box{fill:#ffffff;stroke:#b8c4d0} .acc{fill:#e8f1fd;stroke:#3b82f6} .grn{fill:#e9f7ef;stroke:#22a35a}
  .org{fill:#fff3e6;stroke:#e8891a} .pur{fill:#f3eefc;stroke:#8b5cf6}
  .t{fill:#1b2733;font:600 14px system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}
  .h{fill:#1b2733;font:700 15px system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}
  .g{fill:#55657a;font:600 12px system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;letter-spacing:.04em}
  .s{fill:#4a5a6c;font:12.5px system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}
  .m{fill:#4a5a6c;font:12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .l{fill:#33475b;font:600 12px system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}
  .lb{fill:#ffffff}
  .ln{stroke:#5b6b7d;stroke-width:1.6;fill:none} .lnd{stroke:#5b6b7d;stroke-width:1.6;fill:none;stroke-dasharray:6 5}
  .ah{fill:#5b6b7d}
  @media (prefers-color-scheme: dark){
    .bg{fill:#0d1117} .grp{fill:#151b23;stroke:#30363d} .grp2{fill:#111a26;stroke:#2f4a6b}
    .box{fill:#0d1117;stroke:#3d444d} .acc{fill:#0f2440;stroke:#4c8ff0} .grn{fill:#0f2a1c;stroke:#34b36a}
    .org{fill:#2e1f0c;stroke:#e8913a} .pur{fill:#221838;stroke:#9b7bf0}
    .t,.h{fill:#e6edf3} .g{fill:#8b98a8} .s,.m{fill:#a5b1be} .l{fill:#c9d4df} .lb{fill:#0d1117}
    .ln,.lnd{stroke:#8b98a8} .ah{fill:#8b98a8}
  }
</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect width="1114" height="430" class="bg"/><text x="36" y="34" class="g" text-anchor="start">LAB LIFECYCLE</text>
<rect x="36" y="50" width="194" height="116" rx="10" class="acc" stroke-width="1.4"/>
<text x="50" y="74" class="t" text-anchor="start">1  Design</text>
<text x="50" y="94" class="s" text-anchor="start">Canvas: devices, cables,</text>
<text x="50" y="112" class="s" text-anchor="start">areas, notes, config forms.</text>
<text x="50" y="130" class="s" text-anchor="start">Autosaved to lab.json</text>
<rect x="248" y="50" width="194" height="116" rx="10" class="box" stroke-width="1.4"/>
<text x="262" y="74" class="t" text-anchor="start">2  Generate</text>
<text x="262" y="94" class="s" text-anchor="start">containerlab topology,</text>
<text x="262" y="112" class="s" text-anchor="start">FRR configs, switch and</text>
<text x="262" y="130" class="s" text-anchor="start">server scripts per device</text>
<rect x="460" y="50" width="194" height="116" rx="10" class="org" stroke-width="1.4"/>
<text x="474" y="74" class="t" text-anchor="start">3  Snapshot</text>
<text x="474" y="94" class="s" text-anchor="start">Automatic safety snapshot</text>
<text x="474" y="112" class="s" text-anchor="start">of topology + configs</text>
<text x="474" y="130" class="s" text-anchor="start">(keeps the last 20)</text>
<rect x="672" y="50" width="194" height="116" rx="10" class="box" stroke-width="1.4"/>
<text x="686" y="74" class="t" text-anchor="start">4  Deploy</text>
<text x="686" y="94" class="s" text-anchor="start">containerlab deploy:</text>
<text x="686" y="112" class="s" text-anchor="start">containers, veth cables,</text>
<text x="686" y="130" class="s" text-anchor="start">mgmt net, exec hooks</text>
<rect x="884" y="50" width="194" height="116" rx="10" class="grn" stroke-width="1.4"/>
<text x="898" y="74" class="t" text-anchor="start">5  Running</text>
<text x="898" y="94" class="s" text-anchor="start">FRR daemons converge,</text>
<text x="898" y="112" class="s" text-anchor="start">bridges forward, servers</text>
<text x="898" y="130" class="s" text-anchor="start">answer DNS/DHCP/HTTP</text>
<path d="M230,108 L248,108" class="ln" marker-end="url(#a)"/>
<path d="M442,108 L460,108" class="ln" marker-end="url(#a)"/>
<path d="M654,108 L672,108" class="ln" marker-end="url(#a)"/>
<path d="M866,108 L884,108" class="ln" marker-end="url(#a)"/>
<path d="M981,166 L981,226" class="ln" marker-end="url(#a)"/>
<rect x="20" y="226" width="1074" height="186" rx="14" class="grp" stroke-width="1.4"/>
<text x="36" y="250" class="g" text-anchor="start">WHILE A LAB RUNS</text>
<rect x="36" y="262" width="194" height="116" rx="10" class="box" stroke-width="1.4"/>
<text x="50" y="286" class="t" text-anchor="start">Live edit</text>
<text x="50" y="306" class="s" text-anchor="start">New device: docker run with</text>
<text x="50" y="324" class="s" text-anchor="start">containerlab labels. New</text>
<text x="50" y="342" class="s" text-anchor="start">cable: veth hot-plugged</text>
<rect x="248" y="262" width="194" height="116" rx="10" class="box" stroke-width="1.4"/>
<text x="262" y="286" class="t" text-anchor="start">Consoles</text>
<text x="262" y="306" class="s" text-anchor="start">vtysh or shell in the</text>
<text x="262" y="324" class="s" text-anchor="start">device, streamed to</text>
<text x="262" y="342" class="s" text-anchor="start">xterm.js over WebSocket</text>
<rect x="460" y="262" width="194" height="116" rx="10" class="box" stroke-width="1.4"/>
<text x="474" y="286" class="t" text-anchor="start">Save configs</text>
<text x="474" y="306" class="s" text-anchor="start">write memory lands in</text>
<text x="474" y="324" class="s" text-anchor="start">configs/&lt;node&gt; (bind</text>
<text x="474" y="342" class="s" text-anchor="start">mount), used next deploy</text>
<rect x="672" y="262" width="194" height="116" rx="10" class="box" stroke-width="1.4"/>
<text x="686" y="286" class="t" text-anchor="start">Faults</text>
<text x="686" y="306" class="s" text-anchor="start">link up/down, flap,</text>
<text x="686" y="324" class="s" text-anchor="start">tc netem delay, loss,</text>
<text x="686" y="342" class="s" text-anchor="start">rate, set via nsenter</text>
<rect x="884" y="262" width="194" height="116" rx="10" class="box" stroke-width="1.4"/>
<text x="898" y="286" class="t" text-anchor="start">Simulation</text>
<text x="898" y="306" class="s" text-anchor="start">tcpdump on every port,</text>
<text x="898" y="324" class="s" text-anchor="start">decoded and replayed</text>
<text x="898" y="342" class="s" text-anchor="start">as packet steps</text>
<text x="36" y="400" class="s" text-anchor="start">Destroy removes the containers; lab.json, configs and snapshots stay in /opt/netlab/labs/&lt;lab&gt;.</text></svg>
